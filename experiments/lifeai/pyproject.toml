[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lifeai"
version = "0.1.0"
description = "An embodied LLM agent with bounded memory and sleep, visualized in Pygame."
requires-python = ">=3.11"
dependencies = ["pygame-ce>=2.5.7,<3"]

[project.scripts]
lifeai = "lifeai.__main__:main"

[tool.setuptools.packages.find]
include = ["lifeai*"]
